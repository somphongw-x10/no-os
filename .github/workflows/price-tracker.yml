name: Price Tracker

on:
  schedule:
    # 02:10 UTC = 09:10 Asia/Bangkok, daily.
    # Not on the hour on purpose: GitHub's shared scheduler is congested at :00
    # and jobs there get delayed or dropped.
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch but do not commit'
        type: boolean
        default: false

# Stop a manual run and the nightly run from racing into a push conflict.
concurrency:
  group: price-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch prices from Shopee Affiliate API
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: node scripts/price/fetch-prices.mjs ${{ inputs.dry_run && '--dry' || '' }}

      - name: Build price summary
        if: ${{ !inputs.dry_run }}
        run: node scripts/price/build-summary.mjs

      # The widget reads prices/latest.json at runtime, so the HTML only needs
      # rebuilding when the set of tracked products changes. Running build.py
      # anyway is cheap and idempotent, and keeps the pages honest if a product
      # was added or disabled.
      - name: Rebuild pages
        if: ${{ !inputs.dry_run }}
        run: python3 build.py

      - name: Commit today's data
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "price-tracker[bot]"
          git config user.email "price-tracker[bot]@users.noreply.github.com"

          git add prices *.html

          if git diff --staged --quiet; then
            echo "Nothing changed today."
            exit 0
          fi

          git commit -m "data: prices for $(date -u +%Y-%m-%d)"

          # Someone may have pushed while we were fetching. Rebase and retry
          # rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected — rebasing and retrying ($attempt/3)"
            git pull --rebase --autostash
            sleep 5
          done

          echo "::error::Could not push after 3 attempts"
          exit 1

      - name: Run summary
        if: always()
        run: |
          if [ -f prices/_last-run.json ]; then
            {
              echo "### Price tracker"
              echo '```json'
              cat prices/_last-run.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
